version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fleetvolt_pro
      POSTGRES_USER: fleetvolt
      POSTGRES_PASSWORD: fleetvolt_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetvolt"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Message Brokers
  kafka:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Time Series Database
  influxdb:
    image: influxdb:2.7-alpine
    environment:
      INFLUXDB_DB: fleetvolt_telemetry
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin_password
      INFLUXDB_USER: fleetvolt
      INFLUXDB_USER_PASSWORD: fleetvolt_password
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - INFLUXDB_URL=http://influxdb:8086
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
    command: npm run dev

  # Fleet Monitoring Service
  fleet-monitoring:
    build:
      context: ./services/fleet-monitoring
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - INFLUXDB_URL=http://influxdb:8086
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/fleet-monitoring:/app
      - /app/node_modules
    command: npm run dev

  # Energy & Charging Service
  energy-charging:
    build:
      context: ./services/energy-charging
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - INFLUXDB_URL=http://influxdb:8086
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/energy-charging:/app
      - /app/node_modules
    command: npm run dev

  # Maintenance Service
  maintenance:
    build:
      context: ./services/maintenance
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/maintenance:/app
      - /app/node_modules
    command: npm run dev

  # Safety & Compliance Service
  safety-compliance:
    build:
      context: ./services/safety-compliance
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/safety-compliance:/app
      - /app/node_modules
    command: npm run dev

  # Analytics Service
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - INFLUXDB_URL=http://influxdb:8086
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/analytics:/app
      - /app/node_modules
    command: npm run dev

  # Insurance & Finance Service
  insurance-finance:
    build:
      context: ./services/insurance-finance
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/insurance-finance:/app
      - /app/node_modules
    command: npm run dev

  # Integration & IoT Service
  integration-iot:
    build:
      context: ./services/integration-iot
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
      - PORT=3007
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/integration-iot:/app
      - /app/node_modules
    command: npm run dev

  # Security & Access Service
  security-access:
    build:
      context: ./services/security-access
      dockerfile: Dockerfile
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=development
      - PORT=3008
      - POSTGRES_URL=postgresql://fleetvolt:fleetvolt_dev_password@postgres:5432/fleetvolt_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_key_here
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret_key_here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/security-access:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  influxdb_data:

networks:
  default:
    name: fleetvolt-network