# BluFleet Docker Compose Configuration
# Version: 1.0.0
# Description: Complete development environment setup

version: '3.8'

services:
  # PostgreSQL Database with PostGIS
  postgres:
    image: postgis/postgis:15-3.4
    container_name: blufleet-postgres
    environment:
      POSTGRES_DB: blufleet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    networks:
      - blufleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blufleet -d blufleet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: blufleet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blufleet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway Service
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-api-gateway
    env_file:
      - ./backend/.env.docker
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:api-gateway

  # Fleet Monitoring Service
  fleet-monitoring:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-fleet-monitoring
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://blufleet:blufleet_dev_password@postgres:5432/blufleet
      - REDIS_URL=redis://redis:6379
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:fleet-monitoring

  # Energy & Charging Service
  energy-charging:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-energy-charging
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://blufleet:blufleet_dev_password@postgres:5432/blufleet
      - REDIS_URL=redis://redis:6379
    ports:
      - "3002:3002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:energy-charging

  # Maintenance Service
  maintenance:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-maintenance
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://blufleet:blufleet_dev_password@postgres:5432/blufleet
      - REDIS_URL=redis://redis:6379
    ports:
      - "3003:3003"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:maintenance

  # Safety & Compliance Service
  safety-compliance:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-safety-compliance
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://blufleet:blufleet_dev_password@postgres:5432/blufleet
      - REDIS_URL=redis://redis:6379
    ports:
      - "3004:3004"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:safety-compliance

  # Analytics Service
  analytics:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-analytics
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://blufleet:blufleet_dev_password@postgres:5432/blufleet
      - REDIS_URL=redis://redis:6379
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=blufleet-predictions-20250826
    ports:
      - "3005:3005"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:analytics

  # Insurance & Finance Service
  insurance-finance:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-insurance-finance
    environment:
      - NODE_ENV=development
      - PORT=3006
      - DATABASE_URL=postgresql://blufleet:blufleet_dev_password@postgres:5432/blufleet
      - REDIS_URL=redis://redis:6379
    ports:
      - "3006:3006"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:insurance-finance

  # Integration & IoT Service
  integration-iot:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-integration-iot
    environment:
      - NODE_ENV=development
      - PORT=3007
      - DATABASE_URL=postgresql://blufleet:blufleet_dev_password@postgres:5432/blufleet
      - REDIS_URL=redis://redis:6379
    ports:
      - "3007:3007"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:integration-iot

  # Security & Access Service
  security-access:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-security-access
    environment:
      - NODE_ENV=development
      - PORT=3008
      - DATABASE_URL=postgresql://blufleet:blufleet_dev_password@postgres:5432/blufleet
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-change-in-production
    ports:
      - "3008:3008"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blufleet-network
    command: npm run dev:security-access

  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: blufleet-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api
      - VITE_WS_URL=ws://localhost:3000
      - VITE_ENVIRONMENT=development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - blufleet-network
    command: npm run dev

  # Nginx Reverse Proxy (for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: blufleet-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api-gateway
      - frontend
    networks:
      - blufleet-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  blufleet-network:
    driver: bridge